<title>Шашки Онлайн</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; touch-action: manipulation; }
  #stage { position: absolute; top: 50%; left: 50%; width: 100vh; height: 100vw; transform: translate(-50%, -50%) rotate(90deg); transform-origin: center center; overflow: hidden; background: #000; }
  #startScreen { position: absolute; inset: 0; z-index: 1; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #startControls { position: absolute; left: 40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; z-index: 10; }
  .btn { background: rgba(128,128,128,0.65); color: #fff; border: none; border-radius: 12px; padding: 14px 28px; font-size: 17px; font-weight: 600; cursor: pointer; transition: background .2s, transform .2s; text-align: center; }
  .btn:active { transform: scale(0.95); background: rgba(110,110,110,0.9); }
  #menuWrapper { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: transparent; opacity: 0; visibility: hidden; transition: opacity 0.4s ease; pointer-events: none; }
  #menuWrapper.active { opacity: 1; visibility: visible; }
  #menuCard { background: #2a2a2a; border-radius: 20px; padding: 20px; width: 400px; max-width: 80vw; box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; gap: 15px; transform: scale(0.8); transition: transform 0.4s; pointer-events: auto; }
  #menuWrapper.active #menuCard { transform: scale(1); }
  #catImage { width: 100%; height: 150px; object-fit: cover; border-radius: 12px; }
  .btn-red { background: #d63a3a; font-size: 20px; padding: 15px; width: 100%; }
  .btn-gray { background: #444; color: #fff; font-weight: 700; width: 100%; }

  #gameScreen { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; }
  #gameScreen.active { display: flex; }
  #gameBgVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.3; }
  #boardContainer { position: relative; width: 80vh; height: 80vh; max-width: 90vw; max-height: 90vw; border: 4px solid #5d4037; z-index: 2; background: rgba(0,0,0,0.3); }
  #board { width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .cell { display: flex; align-items: center; justify-content: center; position: relative; }
  .cell.black { background: #3e2723; }
  .cell.white { background: #d7ccc8; }
  .piece { width: 80%; height: 80%; border-radius: 50%; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.6); transition: transform 0.2s; }
  .piece.white { background: radial-gradient(circle at 30% 30%, #fff, #bbb); border: 2px solid #888; }
  .piece.black { background: radial-gradient(circle at 30% 30%, #555, #111); border: 2px solid #000; }
  .piece.selected { transform: scale(1.15); box-shadow: 0 0 15px 5px rgba(255, 235, 59, 0.8); }
  .piece.king::after { content: "★"; color: gold; font-size: 24px; }
  .cell.valid-move::after { content: ""; width: 30%; height: 30%; border-radius: 50%; background: rgba(76, 175, 80, 0.7); position: absolute; }
  .cell.capture-move::after { content: ""; width: 60%; height: 60%; border-radius: 50%; border: 4px solid rgba(244, 67, 54, 0.8); position: absolute; }
  #gameHeader { position: absolute; top: 20px; color: white; font-size: 24px; font-weight: bold; z-index: 3; text-align: center; width: 100%; text-shadow: 1px 1px 4px #000;}
  #backToMenuBtn { position: absolute; top: 20px; right: 20px; z-index: 40; background: #d63a3a; padding: 10px 20px; }

  #codeModal { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
  #codeModal.active { display: flex; }
  #codeInput { padding: 15px; font-size: 24px; text-align: center; border-radius: 10px; border: none; width: 200px; text-transform: uppercase; }
  #roomCodeDisplay { font-size: 40px; color: gold; font-weight: bold; letter-spacing: 5px; margin: 20px 0; }
  #copyBtn { background: #4CAF50; color: white; padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; font-size: 16px; }
  .modal-text { color: white; font-size: 18px; text-align: center; }
</style>
</head>

<div id="stage">
  <div id="startScreen"><video id="bgVideo" src="https://videotourl.com/videos/1795446308436-cb005786-091b-4973-ab55-8048fa47298b.mp4" autoplay muted loop playsinline></video></div>
  <div id="startControls"><button id="playBtn" class="btn">▶ Играть</button></div>
  <div id="menuWrapper">

      <input type="text" id="codeInput" placeholder="код">
      <button id="connectBtn" class="btn btn-red" style="width: auto; padding: 10px 40px;">Подключиться</button>
    </div>
    <button id="closeModalBtn" class="btn btn-gray" style="width: auto; margin-top: 20px;">Отмена</button>
  </div>
  <div id="gameScreen">
    <video id="gameBgVideo" src="https://videotourl.com/videos/1795446308436-cb005786-091b-4973-ab55-8048fa47298b.mp4" autoplay muted loop playsinline></video>
    <div id="gameHeader">Ожидание...</div>
    <button id="backToMenuBtn" class="btn">В меню</button>
    <div id="boardContainer"><div id="board"></div></div>
  </div>
</div>
